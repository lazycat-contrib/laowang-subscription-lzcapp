application:
  subdomain: laowang-subscription
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://laowang-subscription:8080/
services:
  laowang-subscription:
    # upstream: ghcr.io/tony-wang1990/laowang-subscription:6f00e2b@sha256:af4d4cf03406311d81e40ff530beef078bbd623a9e6b50ba00d9219b0475af1a
    image: registry.lazycat.cloud/czyt/tony-wang1990/laowang-subscription:22eee19996204a48
    binds:
      - /lzcapp/var/database:/app/database
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - JWT_SECRET={{ stable_secret "jwt#secret" }}
      - HASH_SECRET={{ stable_secret "hash#secret" }}
