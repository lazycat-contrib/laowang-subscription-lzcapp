version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/laowang-subscription.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: laowang-subscription
    bump: patch

build:
  run_buildscript: false

images:
  - id: laowang-subscription
    target: service
    service: laowang-subscription
    source: ghcr.io/tony-wang1990/laowang-subscription
    channel: custom
    sort: created
    tag_regex: '^[0-9a-f]{7}$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: 老王订阅管理系统
    summary: 一款高颜值的私有化订阅管理系统。
